<!DOCTYPE html>
<html lang="es">

<link rel="manifest" href="entrena.webmanifest">
<link rel="icon" type="image/svg+xml" href="entrena.svg">

<script>
// Tema antes de pintar: la elección de la app y la guía (misma preferencia guardada); «Sistema» no fija nada
(function () {
  try {
    var p = localStorage.getItem('physiq-assessment-theme');
    if (p === 'light' || p === 'dark') document.documentElement.setAttribute('data-theme', p);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Base: márgenes del móvil (barras del sistema) y [hidden] */
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: una columna de 520 px como máximo; pantallas que se sustituyen (inicio, partida, resultado),
   con los colores de la hoja impresa: azul = pregunta, morado = hipótesis, rojo = derivación, gris discontinuo = sin hipótesis. */
:root {
  --bg: #f3f5fa; --surface: #ffffff; --surface2: #eceff6; --border: #d5dbe7; --border2: #bcc5d6;
  --text: #182134; --text2: #4a5673; --text3: #77839c; --sobre: #ffffff;
  --q: #2c66d6; --q-bg: #e7efff; --hyp: #7447d1; --hyp-bg: #f0eaff; --hyp-text: #4f2aa3;
  --der: #c6303b; --der-bg: #fdebed; --ok: #17905f; --ok-bg: #e0f5ec; --mal: #c6303b; --mal-bg: #fdebed;
  --oro: #b98a0e; --plata: #7d889c; --bronce: #a8642f; --scrim: rgba(16, 22, 36, .45);
  --f-body: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1320; --surface: #161d2c; --surface2: #1e2638; --border: #2b3550; --border2: #3a4666;
  --text: #e6ebf5; --text2: #a8b3c9; --text3: #75819a; --sobre: #0b1020;
  --q: #5e9cff; --q-bg: #15264a; --hyp: #a989f6; --hyp-bg: #261c46; --hyp-text: #cbb8ff;
  --der: #f06872; --der-bg: #3b1a21; --ok: #3fcf95; --ok-bg: #11342a; --mal: #f06872; --mal-bg: #3b1a21;
  --oro: #e5bb3c; --plata: #a4afc2; --bronce: #d08a52; --scrim: rgba(0, 0, 0, .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2c; --surface2: #1e2638; --border: #2b3550; --border2: #3a4666;
  --text: #e6ebf5; --text2: #a8b3c9; --text3: #75819a; --sobre: #0b1020;
  --q: #5e9cff; --q-bg: #15264a; --hyp: #a989f6; --hyp-bg: #261c46; --hyp-text: #cbb8ff;
  --der: #f06872; --der-bg: #3b1a21; --ok: #3fcf95; --ok-bg: #11342a; --mal: #f06872; --mal-bg: #3b1a21;
  --oro: #e5bb3c; --plata: #a4afc2; --bronce: #d08a52; --scrim: rgba(0, 0, 0, .6); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .carta-swipe:focus-visible { outline: 3px solid var(--q); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.etq { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); }

/* Cabecera e inicio */
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.cab h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.1; }
.racha { display: flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: .85rem; color: var(--text2);
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.racha svg { width: 16px; height: 16px; color: var(--der); }
.mapa { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.mapa-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.medalla { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.medalla .disco { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--sobre); flex: none; }
.medalla small { display: block; font-weight: 400; color: var(--text3); font-size: .8rem; }
.pasos { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 10px 8px; }
.paso-tile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.num-paso { width: 30px; height: 30px; border-radius: 50%; background: var(--q); color: var(--sobre); display: grid; place-items: center; font-weight: 700; font-size: .95rem; flex: none; }
.barra { width: 100%; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--q); border-radius: 4px; }
.paso-tile small { font-family: var(--f-mono); font-size: .72rem; color: var(--text3); }

.grupo { display: flex; flex-direction: column; gap: 8px; }
.grupo h2 { font-family: var(--f-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); font-weight: 500; }
.modo { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; min-height: 64px; }
.modo:hover:not(:disabled) { border-color: var(--border2); }
.modo:disabled { opacity: .55; cursor: default; }
.modo.destacado { border: 2px solid var(--q); }
.modo .ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; }
.modo .ico svg { width: 22px; height: 22px; }
.modo h3 { font-size: 1rem; font-weight: 600; }
.modo p { color: var(--text2); font-size: .85rem; }
.modo .rec { font-family: var(--f-mono); font-size: .75rem; color: var(--text3); text-align: right; white-space: nowrap; }
.modo:not(:has(> .rec)) { grid-template-columns: 40px minmax(0, 1fr); }
.modo-cab { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; }
.i-q { background: var(--q-bg); color: var(--q); }
.i-ok { background: var(--ok-bg); color: var(--ok); }
.i-hyp { background: var(--hyp-bg); color: var(--hyp); }
.i-der { background: var(--der-bg); color: var(--der); }
.i-gris { background: var(--surface2); color: var(--text2); }

.logros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.logro { display: flex; gap: 8px; align-items: flex-start; padding: 8px; border-radius: 10px; background: var(--surface2); }
.logro svg { width: 22px; height: 22px; flex: none; color: var(--border2); }
.logro.si svg { color: var(--oro); }
.logro b { font-size: .84rem; display: block; line-height: 1.25; }
.logro:not(.si) b { color: var(--text2); }
.logro small { color: var(--text3); font-size: .74rem; display: block; line-height: 1.3; }

.pie { color: var(--text3); font-size: .8rem; display: flex; flex-direction: column; gap: 8px; }
.enlace { background: none; border: 0; padding: 8px 0; color: var(--text2); text-decoration: underline; text-underline-offset: 3px; font-size: .85rem; text-align: left; }
.confirmar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--der-bg); border-radius: 10px; padding: 10px 12px; color: var(--text); }
.confirmar p { flex: 1 1 100%; font-size: .88rem; }

/* Botones */
.btn { border-radius: 10px; padding: 12px 16px; min-height: 48px; font-weight: 600; border: 1px solid var(--border2); background: var(--surface); }
.btn-pri { background: var(--q); border-color: var(--q); color: var(--sobre); }
.btn-der, .btn-falso { background: var(--mal); border-color: var(--mal); color: var(--sobre); }
.btn-verdad { background: var(--ok); border-color: var(--ok); color: var(--sobre); }
.btn:disabled { opacity: .45; cursor: default; }
.fila-btn { display: flex; gap: 10px; }
.fila-btn .btn { flex: 1 1 0; min-width: 0; padding-inline: 8px; white-space: nowrap; }

/* Barra de partida (fija arriba) */
.barra-juego { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; position: sticky; top: env(safe-area-inset-top, 0px);
  background: var(--bg); padding-block: 8px; z-index: 5; }
.barra-juego .reloj { grid-column: 1 / -1; }
.salir { background: none; border: 0; color: var(--text2); padding: 10px 4px; min-height: 44px; font-size: .95rem; white-space: nowrap; }
.centro { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1 1 0; min-width: 0; text-align: center; }
.vidas { display: flex; gap: 4px; }
.vidas svg { width: 20px; height: 20px; }
.vidas .vacia { opacity: .2; }
.marcador { font-family: var(--f-mono); font-size: .95rem; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; min-width: 48px; white-space: nowrap; }
.marcador small { display: block; font-size: .72rem; color: var(--text3); }
.reloj { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.reloj i { display: block; height: 100%; background: var(--q); width: 100%; }
.reloj.prisa i { background: var(--der); }
.progreso { font-family: var(--f-mono); font-size: .75rem; color: var(--text3); }

.tarjeta { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.pregunta-caja { border: 2px solid var(--q); background: var(--q-bg); border-radius: 12px; padding: 12px; display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; }
.pregunta-caja p { font-weight: 600; font-size: 1rem; }
.respuesta-caja { border: 1px solid var(--border2); background: var(--surface); border-radius: 10px; padding: 10px 12px; text-align: left; width: 100%; }
.respuesta-caja b { display: block; font-size: .95rem; }
.respuesta-caja span { color: var(--text2); font-size: .88rem; }
.enunciado { font-size: 1.15rem; font-weight: 600; text-wrap: balance; }
.flecha { color: var(--text3); font-family: var(--f-mono); font-size: .8rem; }

.opciones { display: flex; flex-direction: column; gap: 8px; }
.opciones.cuadricula { display: grid; grid-template-columns: repeat(5, 1fr); }
.op { text-align: left; background: var(--surface); border: 1.5px solid var(--border2); border-radius: 12px; padding: 12px; min-height: 52px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; transition: transform .1s; }
.op:active { transform: scale(.98); }
.cuadricula .op { min-width: 0; padding-inline: 2px; justify-content: center; font-family: var(--f-mono); font-size: 1.15rem; font-weight: 500; }
.op[aria-pressed="true"] { border-color: var(--hyp); background: var(--hyp-bg); }
.op.ok { border-color: var(--ok); background: var(--ok-bg); }
.op.mal { border-color: var(--mal); background: var(--mal-bg); }
.op.falta { border-color: var(--oro); border-style: dashed; }
.op.atenuada { opacity: .5; }
.op:disabled { cursor: default; }
.op.texto { font-weight: 500; }
.op .nota-est { flex: 1 1 100%; font-size: .78rem; color: var(--text2); }

.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 4px 8px 4px 4px; background: var(--hyp-bg);
  border: 1.5px solid var(--hyp); color: var(--hyp-text); font-size: .88rem; font-weight: 600; line-height: 1.25; }
.chip .n { width: 22px; height: 22px; border-radius: 50%; background: var(--hyp); color: var(--sobre); display: grid; place-items: center; font-size: .75rem; flex: none; font-weight: 700; }
.chip-sin { display: inline-flex; border: 1.5px dashed var(--border2); color: var(--text3); border-radius: 8px; padding: 4px 10px; font-size: .88rem; }
.chip-der { display: inline-flex; border: 1.5px solid var(--der); background: var(--der-bg); color: var(--der); border-radius: 8px; padding: 4px 10px; font-size: .88rem; font-weight: 600; }

.aviso { border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: .92rem; }
.aviso-ok { background: var(--ok-bg); color: var(--text); }
.aviso-mal { background: var(--mal-bg); color: var(--text); }
.aviso-info { background: var(--q-bg); color: var(--text); }
.aviso .tit { font-weight: 700; }
.aviso .porque { color: var(--text2); font-size: .86rem; }
.puntos-flotan { font-family: var(--f-mono); font-weight: 500; color: var(--ok); text-align: center; min-height: 1.4em; }

/* Caso */
.ficha { border-left: 4px solid var(--ok); }
.ficha ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--text2); font-size: .92rem; }
.camino { display: flex; flex-direction: column; gap: 8px; }
.camino-fila { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.camino-fila .num-paso { width: 26px; height: 26px; font-size: .85rem; }
.camino-fila.mal .num-paso { background: var(--mal); }
.camino-fila.ok .num-paso { background: var(--ok); }
.camino-fila p { font-size: .9rem; }
.camino-fila .tuya { color: var(--mal); font-size: .82rem; }

/* Hoja (fantasma y encuentra el error) */
.hoja-paso { display: flex; flex-direction: column; gap: 8px; }
.hoja-op { display: grid; grid-template-columns: 1fr 18px 1fr; gap: 6px; align-items: center; }
.hoja-op .respuesta-caja { padding: 8px 10px; }
.hoja-op .respuesta-caja b { font-size: .86rem; }
.hoja-op .respuesta-caja span { font-size: .78rem; }
.hueco { min-height: 52px; border: 2px dashed var(--hyp); border-radius: 10px; background: transparent; color: var(--hyp); display: flex; flex-wrap: wrap;
  gap: 4px; align-items: center; justify-content: center; padding: 6px; font-family: var(--f-mono); font-size: 1.1rem; width: 100%; }
.hueco.lleno { border-style: solid; justify-content: flex-start; font-family: var(--f-body); font-size: .86rem; color: var(--text); text-align: left; }
.hueco.azul { border-color: var(--q); color: var(--q); }
.hueco.azul.lleno { color: var(--text); background: var(--q-bg); font-weight: 600; }
.hueco.gris { border-color: var(--border2); color: var(--text3); }
.hueco.ok, .res-caja.ok { border-color: var(--ok); background: var(--ok-bg); }
.hueco.mal, .res-caja.mal { border-color: var(--mal); background: var(--mal-bg); }
.res-caja.falta { border-color: var(--oro); border-style: dashed; border-width: 2px; }
.hueco .chip { font-size: .78rem; }
.correcta { grid-column: 1 / -1; font-size: .78rem; color: var(--text2); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.hoja-op .chip-sin, .hoja-op .chip-der, .res-caja .chip-sin, .res-caja .chip-der { font-size: .78rem; }
.res-caja { border: 1.5px solid var(--border); border-radius: 10px; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; min-height: 48px; align-items: center; background: var(--surface); width: 100%; text-align: left; }
.res-caja .chip { font-size: .78rem; }
.marcable[aria-pressed="true"] { outline: 3px solid var(--oro); outline-offset: 2px; }
.pregunta-caja.ok { border-color: var(--ok); background: var(--ok-bg); }
.pregunta-caja.mal { border-color: var(--mal); background: var(--mal-bg); }
.pregunta-caja.falta { border-color: var(--oro); border-style: dashed; }

/* Selector inferior */
.velo { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.hoja-sel { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; max-height: 82vh; display: flex; flex-direction: column;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 12px; }
.hoja-sel .asa { width: 36px; height: 4px; border-radius: 2px; background: var(--border2); margin: -6px auto -2px; flex: none; touch-action: none; }
.hoja-sel .lista { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.sel-cab { display: flex; flex-direction: column; gap: 2px; flex: none; }
.sel-cab span { color: var(--text2); font-size: .88rem; }
.sel-op { flex: none; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px; min-height: 44px; }
.sel-op[aria-pressed="true"] { border-color: var(--hyp); background: var(--hyp-bg); }
.sel-op .n { width: 24px; height: 24px; border-radius: 50%; background: var(--hyp); color: var(--sobre); display: grid; place-items: center; font-size: .78rem; font-weight: 700; flex: none; }
.sel-op small { color: var(--text3); }

/* Desliza */
.mesa { min-height: 260px; display: flex; overflow-x: clip; overflow-y: visible; } /* la carta sale volando sin ensanchar la página */
.carta-swipe { position: relative; flex: 1; background: var(--surface); border: 2px solid var(--border2); border-radius: 18px; padding: 40px 18px 18px;
  display: flex; flex-direction: column; gap: 12px; justify-content: center; padding-top: 56px; touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: transform .18s ease-out, border-color .1s, opacity .18s; cursor: grab; }
.carta-swipe[data-dir="v"] { border-color: var(--ok); }
.carta-swipe[data-dir="f"] { border-color: var(--mal); }
.sello { position: absolute; top: 12px; font-family: var(--f-mono); font-weight: 500; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 6px; border: 2px solid; opacity: .25; }
.sello-v { right: 12px; color: var(--ok); }
.sello-f { left: 12px; color: var(--mal); }
.carta-swipe[data-dir="v"] .sello-v, .carta-swipe[data-dir="f"] .sello-f { opacity: 1; }
.feedback { min-height: 3.2em; font-size: .88rem; color: var(--text2); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.feedback b { color: var(--mal); }

/* Semáforo */
.sem-fila { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sem { min-height: 64px; border-radius: 12px; font-weight: 700; border: 2px solid; background: var(--surface); font-size: .92rem; padding: 6px; }
.sem-D { border-color: var(--der); color: var(--der); background: var(--der-bg); }
.sem-H { border-color: var(--hyp); color: var(--hyp-text); background: var(--hyp-bg); }
.sem-0 { border-style: dashed; border-color: var(--border2); color: var(--text2); }
.hallazgo-carta { min-height: 150px; justify-content: center; }
.hallazgo-carta .h { font-size: 1.1rem; font-weight: 600; }

/* Parejas */
.parejas { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .parejas { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.carta-par { min-height: 100px; border-radius: 12px; border: 1.5px solid var(--border2); background: var(--surface); padding: 8px; display: flex; flex-direction: column;
  gap: 4px; align-items: flex-start; justify-content: center; text-align: left; font-size: .8rem; line-height: 1.3; }
.carta-par.boca-abajo { background: repeating-linear-gradient(45deg, var(--q-bg) 0 8px, var(--surface2) 8px 16px); }
.carta-par.hecha { border-color: var(--ok); background: var(--ok-bg); }
.carta-par .chip, .carta-par .chip-der { font-size: .74rem; }

/* Ordena */
.slots { display: flex; flex-direction: column; gap: 6px; }
.slot { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; min-height: 52px; border: 1.5px dashed var(--border2); border-radius: 10px;
